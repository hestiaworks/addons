name: "NSPanel Companion Updater"
description: "Discover and safely update NSPanel Companion devices over network ADB"
version: "0.3.0"
slug: "nspanel_companion_updater"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
map:
  - type: share
    read_only: true
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Local updater API"
options:
  subnet: "192.168.0.0/24"
  repository: "dmitrogajduk/ha-companion"
  channel: "stable"
  local_release_directory: "/share/nspanel-companion-release"
schema:
  subnet: str
  repository: str
  channel: list(stable|prerelease)
  local_release_directory: str
stage: experimental
